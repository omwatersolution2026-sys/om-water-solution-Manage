<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard | Om Water Solution</title>
    
    <!-- Security Check -->
    <script>
        if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.replace('index.html');
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 600: '#2563eb' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-20">

    <!-- Top Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center font-bold">O</div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight">Om Water</h1>
                        <p class="text-xs text-blue-600 font-semibold tracking-wide">ADMIN MASTER PANEL</p>
                    </div>
                </div>
                <button id="logout-btn" class="text-slate-500 hover:text-red-500 transition-colors p-2 bg-slate-50 rounded-full font-medium text-xs">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6">

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-semibold text-slate-400 uppercase">Total Active</p>
                <h3 class="text-2xl font-bold text-slate-800 mt-1" id="stat-total">0</h3>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-semibold text-orange-500 uppercase">Service Today</p>
                <h3 class="text-2xl font-bold text-orange-600 mt-1" id="stat-today">0</h3>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-semibold text-red-500 uppercase">Missed Service</p>
                <h3 class="text-2xl font-bold text-red-600 mt-1" id="stat-missed">0</h3>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                <p class="text-xs font-semibold text-green-500 uppercase">Upcoming</p>
                <h3 class="text-2xl font-bold text-green-600 mt-1" id="stat-upcoming">0</h3>
            </div>
        </div>

        <!-- Action Button -->
        <button id="open-add-cx-btn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-100 hover:bg-blue-700 transition-all flex items-center justify-center gap-2">
            <span>+ Add New Service Card / Customer</span>
        </button>

        <!-- Customers & Service Records Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="font-bold text-slate-800">Customer Service Database</h3>
                <div class="flex gap-1 text-xs font-semibold">
                    <button class="filter-btn px-3 py-1.5 rounded-lg bg-white shadow text-slate-800" data-filter="all">All</button>
                    <button class="filter-btn px-3 py-1.5 rounded-lg text-slate-500 hover:text-slate-800" data-filter="today">Today</button>
                    <button class="filter-btn px-3 py-1.5 rounded-lg text-slate-500 hover:text-slate-800" data-filter="missed">Missed</button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 text-xs text-slate-400 uppercase bg-slate-50/30">
                            <th class="p-4">Customer Details</th>
                            <th class="p-4">Contract Period</th>
                            <th class="p-4">Next Service</th>
                            <th class="p-4">Status</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="master-table-body" class="divide-y divide-slate-100 text-sm">
                        <tr><td colspan="5" class="p-8 text-center text-slate-400">Loading records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- ADD CUSTOMER MODAL -->
    <div id="add-cx-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl max-h-[90vh] flex flex-col shadow-2xl p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">Add Service Card Record</h3>
                <button id="close-add-cx-modal" class="text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            
            <form id="add-cx-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Customer Name</label>
                    <input type="text" id="cx-name" required class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Tejas Dharmadhikari">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Full Address</label>
                    <textarea id="cx-address" required rows="2" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. 301 Satyam Villa, Airoli"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Contact No.</label>
                        <input type="tel" id="cx-phone" required class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none" placeholder="8087330664">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Unit Model</label>
                        <input type="text" id="cx-unit" placeholder="e.g. Compact / RO" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Contract From</label>
                        <input type="date" id="cx-start-date" required class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Contract To</label>
                        <input type="date" id="cx-end-date" required class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Amount (₹)</label>
                        <input type="number" id="cx-amount" value="2250" required class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none font-bold text-blue-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Bill No.</label>
                        <input type="text" id="cx-bill" placeholder="e.g. 28153" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none">
                    </div>
                </div>
                <button type="submit" id="save-cx-btn" class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg mt-4 hover:bg-black">Save Record</button>
            </form>
        </div>
    </div>

    <!-- SERVICE HISTORY MODAL (Ye purani history dikhayega) -->
    <div id="history-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl max-h-[90vh] flex flex-col shadow-2xl p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800" id="history-modal-title">Service Card History</h3>
                <button id="close-history-modal" class="text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            <div id="history-content" class="space-y-3">
                <!-- History logs dynamically load honge -->
            </div>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
