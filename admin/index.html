<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | Om Water Solution</title>
    
    <!-- Security Check: Agar pehle se logged in hai, toh sidha dashboard bhejo -->
    <script>
        if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
            window.location.replace('dashboard.html');
        }
    </script>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: '#111827',
                        light: '#ffffff',
                        muted: '#f9fafb',
                        borderGrey: '#e5e7eb'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-muted min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-sm bg-light rounded-3xl shadow-sm border border-borderGrey p-8 flex flex-col h-[550px]">
        
        <!-- Branding -->
        <div class="text-center mt-4 mb-8">
            <h1 class="text-xl font-semibold text-dark tracking-tight">Om Water Solution</h1>
            <p class="text-xs text-gray-500 font-bold tracking-widest uppercase mt-2">Admin Master Access</p>
        </div>

        <!-- Error Message -->
        <div id="error-alert" class="hidden mb-4 text-center">
            <p id="error-msg" class="text-sm text-red-500 font-medium"></p>
        </div>

        <!-- PIN Inputs (4 boxes for 2026) -->
        <div class="flex justify-center gap-4 mb-10">
            <input type="password" maxlength="1" id="pin1" class="w-12 h-14 text-center text-2xl font-bold bg-muted border border-gray-300 rounded-xl focus:border-dark outline-none" inputmode="numeric" autofocus>
            <input type="password" maxlength="1" id="pin2" class="w-12 h-14 text-center text-2xl font-bold bg-muted border border-gray-300 rounded-xl focus:border-dark outline-none" inputmode="numeric">
            <input type="password" maxlength="1" id="pin3" class="w-12 h-14 text-center text-2xl font-bold bg-muted border border-gray-300 rounded-xl focus:border-dark outline-none" inputmode="numeric">
            <input type="password" maxlength="1" id="pin4" class="w-12 h-14 text-center text-2xl font-bold bg-muted border border-gray-300 rounded-xl focus:border-dark outline-none" inputmode="numeric">
        </div>

        <!-- Login Button -->
        <button id="login-btn" class="w-full bg-dark text-white font-medium py-4 rounded-xl shadow-md hover:bg-black transition-all mt-auto mb-4">
            Verify PIN
        </button>

        <!-- Loading -->
        <div id="loading-overlay" class="absolute inset-0 bg-white/90 hidden flex-col items-center justify-center rounded-3xl">
            <div class="w-8 h-8 border-2 border-gray-200 border-t-dark rounded-full animate-spin"></div>
            <p class="mt-3 text-dark text-sm font-medium">Checking Admin...</p>
        </div>
    </div>

    <!-- Script Connection -->
    <script src="js/login.js"></script>
</body>
</html>
