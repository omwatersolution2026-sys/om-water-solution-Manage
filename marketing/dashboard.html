<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing & Calling | Om Water Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: '#0ea5e9', dark: '#1e293b' } } } }
    </script>
</head>
<body class="bg-gray-50 text-dark antialiased">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-brand/10 text-brand rounded-xl flex items-center justify-center font-bold">OW</div>
            <div>
                <h1 class="font-bold text-lg leading-tight">Calling Portal</h1>
                <p class="text-xs text-gray-500">Sales & Service Management</p>
            </div>
        </div>
        <button id="logout-btn" class="text-sm font-medium text-red-500 hover:text-red-700 bg-red-50 px-4 py-2 rounded-lg">Logout</button>
    </nav>

    <div class="max-w-5xl mx-auto p-6">
        
        <!-- Tabs (Sales vs Service) -->
        <div class="flex bg-white rounded-xl p-1 shadow-sm mb-6 border border-gray-100 max-w-sm">
            <button id="tab-sales" class="flex-1 py-2 text-sm font-bold rounded-lg bg-brand text-white shadow transition-all">Sales Leads</button>
            <button id="tab-service" class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-500 hover:text-dark transition-all">Due Services</button>
        </div>

        <!-- ================= SALES VIEW ================= -->
        <div id="view-sales" class="block">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Lead Pipeline</h2>
                <button id="open-add-lead-btn" class="bg-dark text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow hover:-translate-y-0.5 transition-all">+ Add Lead</button>
            </div>
            <!-- Leads Grid -->
            <div id="leads-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="text-center text-gray-400 py-10 text-sm col-span-full">Loading leads...</div>
            </div>
        </div>

        <!-- ================= SERVICE CALLS VIEW ================= -->
        <div id="view-service" class="hidden">
            <div class="mb-4">
                <h2 class="text-xl font-bold">Upcoming & Due Services</h2>
                <p class="text-sm text-gray-500">Call customers to confirm or reschedule their maintenance.</p>
            </div>
            <!-- Services Grid -->
            <div id="services-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="text-center text-gray-400 py-10 text-sm col-span-full">Loading service schedule...</div>
            </div>
        </div>

    </div>

    <!-- Modals (Hidden by default) -->
    <!-- 1. Add Lead Modal (Truncated for space, assume same as before but cleaner) -->
    <div id="add-lead-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-all opacity-0">
        <div id="add-modal-content" class="bg-white rounded-2xl w-full max-w-md p-6 transform translate-y-full transition-all">
            <h3 class="text-lg font-bold mb-4">New Lead</h3>
            <form id="add-lead-form" class="space-y-4">
                <input type="text" id="lead-name" placeholder="Customer Name" required class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-brand/20">
                <input type="tel" id="lead-phone" placeholder="Phone Number" required class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-brand/20">
                <select id="lead-status" class="w-full px-4 py-3 border rounded-xl outline-none bg-white">
                    <option value="New">New Lead</option>
                    <option value="Follow-up">Follow-up</option>
                </select>
                <div class="flex gap-3 pt-2">
                    <button type="button" class="close-add-btn flex-1 px-4 py-3 border border-gray-200 text-gray-600 rounded-xl font-medium">Cancel</button>
                    <button type="submit" id="save-lead-btn" class="flex-1 px-4 py-3 bg-brand text-white rounded-xl font-medium">Save Lead</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. Reschedule Service Modal -->
    <div id="reschedule-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-all opacity-0">
        <div id="reschedule-content" class="bg-white rounded-2xl w-full max-w-sm p-6 transform translate-y-full transition-all">
            <h3 class="text-lg font-bold mb-1">Reschedule Service</h3>
            <p id="reschedule-customer-name" class="text-sm text-gray-500 mb-4"></p>
            <form id="reschedule-form" class="space-y-4">
                <input type="hidden" id="reschedule-customer-id">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">New Service Date</label>
                    <input type="date" id="new-service-date" required class="w-full px-4 py-3 border rounded-xl outline-none focus:ring-2 focus:ring-brand/20">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" class="close-reschedule-btn flex-1 px-4 py-3 border border-gray-200 text-gray-600 rounded-xl font-medium">Cancel</button>
                    <button type="submit" id="confirm-reschedule-btn" class="flex-1 px-4 py-3 bg-orange-500 text-white rounded-xl font-medium">Reschedule</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
