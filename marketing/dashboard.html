<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing & Calling Portal | Om Water Solution</title>
    
    <!-- Security Check -->
    <script>
        if (!sessionStorage.getItem('marketingAuth') && !sessionStorage.getItem('isAdminLoggedIn')) {
            window.location.replace('index.html');
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased pb-20">

    <!-- Top Navigation -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-purple-600 text-white rounded-xl flex items-center justify-center font-black text-xl shadow-inner">M</div>
            <div>
                <h1 class="font-bold text-xl leading-none text-slate-900">Marketing & Calling Desk</h1>
                <p class="text-xs text-slate-500 font-medium">Om Water Solution</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button id="logout-btn" class="text-sm font-semibold text-red-500 bg-red-50 hover:bg-red-100 px-4 py-2 rounded-lg transition-colors">Logout</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6 space-y-6">
        
        <!-- Calling Overview Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-purple-500">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Total Leads / Customers</p>
                <h3 class="text-3xl font-black text-slate-800" id="mkt-total">0</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-orange-400">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Pending Follow-ups</p>
                <h3 class="text-3xl font-black text-orange-500" id="mkt-pending">0</h3>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 border-l-4 border-l-green-500">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Converted / Confirmed</p>
                <h3 class="text-3xl font-black text-green-600" id="mkt-converted">0</h3>
            </div>
        </div>

        <!-- Calling Table Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                <h2 class="text-lg font-bold text-slate-800">Customer Calling & Follow-up Queue</h2>
                <div class="flex bg-slate-100 p-1 rounded-lg">
                    <button class="mkt-filter-btn px-4 py-1.5 text-sm font-semibold rounded-md bg-white shadow text-slate-800" data-filter="all">All</button>
                    <button class="mkt-filter-btn px-4 py-1.5 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-800" data-filter="pending">Pending Calls</button>
                    <button class="mkt-filter-btn px-4 py-1.5 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-800" data-filter="done">Completed</button>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="p-4 font-bold">Customer Details</th>
                            <th class="p-4 font-bold">Service Due</th>
                            <th class="p-4 font-bold">Calling Status</th>
                            <th class="p-4 font-bold">Last Remark / Follow-up</th>
                            <th class="p-4 font-bold text-right">Action / Call</th>
                        </tr>
                    </thead>
                    <tbody id="mkt-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="p-8 text-center text-slate-400">Loading calling data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- MODAL: UPDATE CALL STATUS -->
    <div id="call-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">Update Calling Status</h3>
                <button id="close-call-modal" class="text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            
            <form id="call-form" class="space-y-4">
                <input type="hidden" id="call-cx-id">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Customer Name</label>
                    <input type="text" id="call-cx-name" disabled class="w-full px-4 py-3 bg-slate-100 border rounded-xl font-bold text-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Calling Status Response</label>
                    <select id="call-status-select" required class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none font-semibold">
                        <option value="Pending">Pending / Ringing</option>
                        <option value="Call Back Later">Call Back Later / Follow-up</option>
                        <option value="Confirmed / Scheduled">Confirmed for Service</option>
                        <option value="Not Interested">Not Interested</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Follow-up Remarks / Notes</label>
                    <textarea id="call-remarks" rows="3" required class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none text-sm" placeholder="e.g. Customer asked to call next Monday..."></textarea>
                </div>
                <button type="submit" id="save-call-btn" class="w-full bg-purple-600 text-white font-bold py-4 rounded-xl shadow-lg mt-4 hover:bg-purple-700">Save Call Status</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
