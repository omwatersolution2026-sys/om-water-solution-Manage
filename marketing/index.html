<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marketing Login | Om Water Solution</title>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS Link -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tailwind Config for Marketing Theme (Indigo/Purple) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: '#312e81', /* Indigo 900 */
                        light: '#ffffff',
                        muted: '#f8fafc',
                        borderGrey: '#e2e8f0',
                        brandPurple: '#6366f1' /* Indigo 500 */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-muted min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-100">

    <!-- Minimalist Pure White Card -->
    <div class="w-full max-w-sm bg-light rounded-3xl shadow-[0_4px_40px_rgb(0,0,0,0.06)] border border-borderGrey p-8 relative overflow-hidden flex flex-col h-[620px]">
        
        <!-- Header / Branding -->
        <div class="text-center mt-4 mb-8">
            <div class="w-14 h-14 bg-indigo-50 border border-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-sm">
                <!-- Headset / Telecalling Icon for Marketing Portal -->
                <svg class="w-7 h-7 text-brandPurple" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.5 10.5c.828 0 1.5.672 1.5 1.5v3c0 .828-.672 1.5-1.5 1.5h-1.5a1.5 1.5 0 01-1.5-1.5v-3c0-.828.672-1.5 1.5-1.5h1.5zM4.5 10.5c-.828 0-1.5.672-1.5 1.5v3c0 .828.672 1.5 1.5 1.5h1.5a1.5 1.5 0 001.5-1.5v-3c0-.828-.672-1.5-1.5-1.5h-1.5z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-dark tracking-tight">Om Water Solution</h1>
            <p class="text-xs text-brandPurple font-bold tracking-widest uppercase mt-2">Marketing Desk</p>
        </div>

        <!-- Error Message (Hidden by default) -->
        <div id="error-alert" class="hidden mb-4 text-center transition-all duration-300">
            <p id="error-msg" class="text-sm text-red-500 font-medium tracking-wide"></p>
        </div>

        <!-- Minimal PIN Dots -->
        <div class="flex justify-center gap-5 mb-10">
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-gray-300 transition-all duration-300"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-gray-300 transition-all duration-300"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-gray-300 transition-all duration-300"></div>
            <div class="pin-dot w-4 h-4 rounded-full border-2 border-gray-300 transition-all duration-300"></div>
        </div>

        <!-- Sleek Custom Numpad -->
        <div class="grid grid-cols-3 gap-y-6 gap-x-4 mt-auto pb-4">
            <button class="numpad-btn text-2xl font-medium text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="1">1</button>
            <button class="numpad-btn text-2xl font-medium text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="2">2</button>
            <button class="numpad-btn text-2xl font-medium text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="3">3</button>
            <button class="numpad-btn text-2xl font-medium text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="4">4</button>
            <button class="numpad-btn text-2xl font-medium text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="5">5</button>
            <button class="numpad-btn text-2xl font-medium text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="6">6</button>
            <button class="numpad-btn text-2xl font-medium text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="7">7</button>
            <button class="numpad-btn text-2xl font-medium text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="8">8</button>
            <button class="numpad-btn text-2xl font-medium text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="9">9</button>
            
            <div></div> <!-- Empty space -->
            
            <button class="numpad-btn text-2xl font-medium text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="0">0</button>
            
            <!-- Minimal Backspace Icon -->
            <button id="backspace-btn" class="text-gray-400 hover:text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all active:bg-indigo-50">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path>
                </svg>
            </button>
        </div>
        
        <!-- Elegant Loading Overlay -->
        <div id="loading-overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm hidden flex-col items-center justify-center z-50">
            <div class="w-10 h-10 border-4 border-gray-100 border-t-brandPurple rounded-full animate-spin"></div>
            <p class="mt-4 text-dark text-sm font-bold tracking-wide">Logging In...</p>
        </div>
    </div>

    <!-- Script Connection -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
