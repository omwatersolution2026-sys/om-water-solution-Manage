<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marketing Login | Om Water Solution</title>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS Link -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tailwind Config for Marketing Theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: '#312E81', /* Deep Indigo for Marketing */
                        light: '#ffffff',
                        muted: '#F5F3FF', /* Very light purple/indigo background */
                        borderGrey: '#E0E7FF',
                        accent: '#4F46E5' /* Vibrant Indigo */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-muted min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-200">

    <!-- Premium Card -->
    <div class="w-full max-w-sm bg-light rounded-3xl shadow-[0_8px_30px_rgb(79,70,229,0.08)] border border-borderGrey p-8 relative overflow-hidden flex flex-col h-[600px]">
        
        <!-- Header / Branding -->
        <div class="text-center mt-4 mb-8">
            <div class="w-14 h-14 bg-indigo-50 border border-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-inner">
                <!-- Headset / Calling Icon -->
                <svg class="w-7 h-7 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                </svg>
            </div>
            <h1 class="text-xl font-semibold text-gray-900 tracking-tight">Om Water Solution</h1>
            <p class="text-xs text-accent font-bold tracking-widest uppercase mt-2">Marketing Access</p>
        </div>

        <!-- Error Message -->
        <div id="error-alert" class="hidden mb-4 text-center transition-all duration-300">
            <p id="error-msg" class="text-sm text-red-500 font-medium tracking-wide"></p>
        </div>

        <!-- PIN Dots -->
        <div class="flex justify-center gap-5 mb-12">
            <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-indigo-200 transition-all duration-300"></div>
            <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-indigo-200 transition-all duration-300"></div>
            <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-indigo-200 transition-all duration-300"></div>
            <div class="pin-dot w-3.5 h-3.5 rounded-full border-2 border-indigo-200 transition-all duration-300"></div>
        </div>

        <!-- Custom Numpad -->
        <div class="grid grid-cols-3 gap-y-6 gap-x-4 mt-auto pb-4">
            <button class="numpad-btn text-2xl font-light text-gray-800 w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="1">1</button>
            <button class="numpad-btn text-2xl font-light text-gray-800 w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="2">2</button>
            <button class="numpad-btn text-2xl font-light text-gray-800 w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="3">3</button>
            <button class="numpad-btn text-2xl font-light text-gray-800 w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="4">4</button>
            <button class="numpad-btn text-2xl font-light text-gray-800 w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="5">5</button>
            <button class="numpad-btn text-2xl font-light text-gray-800 w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="6">6</button>
            <button class="numpad-btn text-2xl font-light text-gray-800 w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="7">7</button>
            <button class="numpad-btn text-2xl font-light text-gray-800 w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="8">8</button>
            <button class="numpad-btn text-2xl font-light text-gray-800 w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="9">9</button>
            
            <div></div> <!-- Spacer -->
            
            <button class="numpad-btn text-2xl font-light text-gray-800 w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-indigo-50 active:bg-indigo-100" data-val="0">0</button>
            
            <!-- Backspace -->
            <button id="backspace-btn" class="text-indigo-300 hover:text-accent w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all active:bg-indigo-50">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path>
                </svg>
            </button>
        </div>
        
        <!-- Loading Overlay -->
        <div id="loading-overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm hidden flex-col items-center justify-center z-50">
            <div class="w-8 h-8 border-2 border-indigo-100 border-t-accent rounded-full animate-spin"></div>
            <p class="mt-4 text-accent text-sm font-medium tracking-wide">Authenticating...</p>
        </div>
    </div>

    <!-- Script Connection -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
