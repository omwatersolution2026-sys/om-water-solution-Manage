<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Portal | Om Water Solution</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white px-4 py-3 flex justify-between items-center shadow-md sticky top-0 z-10">
        <div>
            <h1 class="font-bold text-lg">Tech Portal</h1>
            <p class="text-xs text-blue-100">Field Service & Updates</p>
        </div>
        <button id="logout-btn" class="text-sm bg-white/20 px-3 py-1.5 rounded-lg font-medium hover:bg-white/30 transition">Logout</button>
    </nav>

    <div class="p-4 max-w-lg mx-auto space-y-4">
        
        <!-- Search Bar Section (Field Search for Tech) -->
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-gray-200 flex items-center gap-2">
            <svg class="w-5 h-5 text-gray-400 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" id="tech-search-input" placeholder="Search customer by name, phone, or bill ID..." class="w-full bg-transparent outline-none text-sm font-medium text-gray-700">
            <button id="tech-clear-search" class="text-xs font-bold text-gray-400 hover:text-red-500 px-2 py-1 hidden">Clear</button>
        </div>

        <!-- Action Header -->
        <div class="flex justify-between items-center">
            <h2 class="text-lg font-bold">Field Tasks & Calling Queue</h2>
            <button id="open-add-cx-btn" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow hover:bg-blue-700 transition-all">+ Add Customer</button>
        </div>
        
        <!-- Task List Container -->
        <div id="task-list" class="space-y-3">
            <div class="text-center text-gray-400 py-10 text-sm">Loading tasks in real-time...</div>
        </div>
    </div>

    <!-- ================= 1. COMPLETE SERVICE & PARTS MODAL ================= -->
    <div id="service-modal" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center z-50 transition-opacity p-4">
        <div class="bg-white w-full sm:max-w-md rounded-2xl p-5 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold">Complete Service Record</h3>
                <button id="close-modal" class="text-gray-400 text-2xl font-bold">&times;</button>
            </div>
            
            <form id="service-form" class="space-y-4">
                <input type="hidden" id="cust-id">
                <input type="hidden" id="cust-name">
                <input type="hidden" id="cust-phone">
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Parts Replaced / Serviced</label>
                    <div class="grid grid-cols-2 gap-2 text-sm mb-3">
                        <label class="flex items-center gap-2"><input type="checkbox" value="Sediment Filter" class="part-check"> Sediment Filter</label>
                        <label class="flex items-center gap-2"><input type="checkbox" value="Carbon Filter" class="part-check"> Carbon Filter</label>
                        <label class="flex items-center gap-2"><input type="checkbox" value="RO Membrane" class="part-check"> RO Membrane</label>
                        <label class="flex items-center gap-2"><input type="checkbox" value="General Service" class="part-check"> General Service</label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Detailed Work Notes</label>
                    <textarea id="service-notes" rows="2" class="w-full px-3 py-2 border rounded-xl outline-none text-sm focus:ring-2 focus:ring-blue-500" placeholder="e.g. Pump checked, pipes cleaned..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Total Amount Collected (₹)</label>
                    <input type="number" id="service-amount" required class="w-full px-4 py-3 border rounded-xl outline-none font-bold text-blue-600 focus:ring-2 focus:ring-blue-500" placeholder="e.g. 1800">
                </div>

                <button type="submit" id="save-service-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md hover:bg-blue-700 transition">Save Service Record & Update Due Date</button>
            </form>
        </div>
    </div>

    <!-- ================= 2. ADD NEW CUSTOMER MODAL (TECH SIDE) ================= -->
    <div id="add-cx-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full sm:max-w-md rounded-2xl p-5 shadow-xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold">Add New Customer</h3>
                <button id="close-add-cx-modal" class="text-gray-400 text-2xl font-bold">&times;</button>
            </div>
            <form id="add-cx-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Customer Full Name</label>
                    <input type="text" id="new-name" placeholder="e.g. Sharma Ji" required class="w-full px-4 py-3 border rounded-xl outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Phone Number</label>
                    <input type="tel" id="new-phone" placeholder="9876543210" required class="w-full px-4 py-3 border rounded-xl outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Area / Complete Address</label>
                    <input type="text" id="new-address" placeholder="Location..." required class="w-full px-4 py-3 border rounded-xl outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Unit Model</label>
                    <input type="text" id="new-unit" value="Compact" required class="w-full px-4 py-3 border rounded-xl outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Bill ID (Leave blank for auto-generation)</label>
                    <input type="text" id="new-bill" placeholder="e.g. OWS-2026-XXXX" class="w-full px-4 py-3 border rounded-xl outline-none text-sm">
                </div>
                <button type="submit" id="save-cx-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl shadow-md text-sm hover:bg-blue-700 transition">Save & Set Initial Service</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
