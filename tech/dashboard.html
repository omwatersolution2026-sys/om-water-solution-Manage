<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tech Portal | Om Water Solution</title>
    
    <!-- Security Check -->
    <script>
        if (sessionStorage.getItem('techAuth') !== 'true') {
            window.location.replace('index.html');
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">

    <!-- jsPDF Library for generating official bill PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 600: '#2563eb' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased pb-20">

    <!-- Top Navigation -->
    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-orange-50 text-orange-600 rounded-lg flex items-center justify-center font-bold">T</div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight">Om Water</h1>
                        <p class="text-xs text-orange-600 font-semibold tracking-wide">TECH / FIELD PORTAL</p>
                    </div>
                </div>
                <button id="logout-btn" class="text-slate-500 hover:text-red-500 transition-colors p-2 bg-slate-50 rounded-full font-medium text-xs">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6">

        <div>
            <h2 class="text-xl font-bold text-slate-800">Pending & Due Services</h2>
            <p class="text-xs text-slate-500">Select a customer to complete service & generate WhatsApp PDF Bill.</p>
        </div>

        <!-- Assigned Tasks Table / List -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                <h3 class="font-bold text-slate-800 text-sm">Customer Queue</h3>
            </div>
            <div id="tech-tasks-list" class="divide-y divide-slate-100">
                <!-- Dynamically loaded tasks -->
                <div class="p-8 text-center text-slate-400">Loading assigned tasks...</div>
            </div>
        </div>

    </main>

    <!-- SERVICE UPDATE & PDF MODAL -->
    <div id="service-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl max-h-[90vh] flex flex-col shadow-2xl p-6 overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">Complete Service & Bill</h3>
                <button id="close-service-modal" class="text-gray-400 hover:text-red-500 text-2xl font-bold">&times;</button>
            </div>
            
            <form id="service-update-form" class="space-y-4">
                <input type="hidden" id="modal-cx-id">
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Customer Name</label>
                    <input type="text" id="modal-cx-name" readonly class="w-full px-4 py-3 bg-slate-100 border rounded-xl font-medium text-slate-700">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Service Date</label>
                        <input type="date" id="service-date" required class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Status</label>
                        <select id="service-status" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none text-sm font-semibold">
                            <option value="Service">Service Done</option>
                            <option value="AMC Renewal">AMC Renewal</option>
                            <option value="Repair / Parts">Repair / Part Change</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Part Replaced (if any)</label>
                    <input type="text" id="service-part" placeholder="e.g. Filter C Change / Carbon Block" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Amount Collected (₹)</label>
                        <input type="number" id="service-amount" required class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none font-bold text-blue-600" placeholder="1800">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Engineer Name</label>
                        <input type="text" id="service-engineer" value="Amey" required class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Remark / Notes</label>
                    <input type="text" id="service-remark" placeholder="e.g. Working fine, Payment received via Cash" class="w-full px-4 py-3 bg-gray-50 border rounded-xl outline-none text-sm">
                </div>

                <button type="submit" id="complete-service-btn" class="w-full bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-orange-100 mt-4 hover:bg-orange-700 transition">
                    Save Record & Download PDF Bill
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
