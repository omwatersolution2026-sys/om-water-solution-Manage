<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tech Login | Om Water Solution</title>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS Link -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tailwind Minimalist Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: '#111827',
                        light: '#ffffff',
                        muted: '#f9fafb',
                        borderGrey: '#e5e7eb'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-muted min-h-screen flex items-center justify-center p-4 antialiased selection:bg-gray-200">

    <!-- Minimalist Pure White Card -->
    <div class="w-full max-w-sm bg-light rounded-3xl shadow-[0_4px_40px_rgb(0,0,0,0.04)] border border-borderGrey p-8 relative overflow-hidden flex flex-col h-[600px]">
        
        <!-- Header / Branding -->
        <div class="text-center mt-4 mb-8">
            <div class="w-12 h-12 border border-gray-200 rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-sm bg-gray-50">
                <!-- Service / Wrench Icon for Tech Portal -->
                <svg class="w-6 h-6 text-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </div>
            <h1 class="text-xl font-semibold text-dark tracking-tight">Om Water Solution</h1>
            <p class="text-xs text-gray-500 font-bold tracking-widest uppercase mt-2">Engineer Access</p>
        </div>

        <!-- Error Message (Hidden by default) -->
        <div id="error-alert" class="hidden mb-4 text-center transition-all duration-300">
            <p id="error-msg" class="text-sm text-red-500 font-medium tracking-wide"></p>
        </div>

        <!-- Minimal PIN Dots -->
        <div class="flex justify-center gap-5 mb-12">
            <div class="pin-dot w-3.5 h-3.5 rounded-full border border-gray-300 transition-all duration-300"></div>
            <div class="pin-dot w-3.5 h-3.5 rounded-full border border-gray-300 transition-all duration-300"></div>
            <div class="pin-dot w-3.5 h-3.5 rounded-full border border-gray-300 transition-all duration-300"></div>
            <div class="pin-dot w-3.5 h-3.5 rounded-full border border-gray-300 transition-all duration-300"></div>
        </div>

        <!-- Sleek Custom Numpad -->
        <div class="grid grid-cols-3 gap-y-6 gap-x-4 mt-auto pb-4">
            <button class="numpad-btn text-2xl font-light text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-gray-50 active:bg-gray-100" data-val="1">1</button>
            <button class="numpad-btn text-2xl font-light text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-gray-50 active:bg-gray-100" data-val="2">2</button>
            <button class="numpad-btn text-2xl font-light text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-gray-50 active:bg-gray-100" data-val="3">3</button>
            <button class="numpad-btn text-2xl font-light text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-gray-50 active:bg-gray-100" data-val="4">4</button>
            <button class="numpad-btn text-2xl font-light text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-gray-50 active:bg-gray-100" data-val="5">5</button>
            <button class="numpad-btn text-2xl font-light text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-gray-50 active:bg-gray-100" data-val="6">6</button>
            <button class="numpad-btn text-2xl font-light text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-gray-50 active:bg-gray-100" data-val="7">7</button>
            <button class="numpad-btn text-2xl font-light text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-gray-50 active:bg-gray-100" data-val="8">8</button>
            <button class="numpad-btn text-2xl font-light text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-gray-50 active:bg-gray-100" data-val="9">9</button>
            
            <div></div> <!-- Empty space -->
            
            <button class="numpad-btn text-2xl font-light text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all hover:bg-gray-50 active:bg-gray-100" data-val="0">0</button>
            
            <!-- Minimal Backspace Icon -->
            <button id="backspace-btn" class="text-gray-400 hover:text-dark w-16 h-16 rounded-full mx-auto flex items-center justify-center transition-all active:bg-gray-50">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z"></path>
                </svg>
            </button>
        </div>
        
        <!-- Elegant Loading Overlay -->
        <div id="loading-overlay" class="absolute inset-0 bg-white/95 backdrop-blur-sm hidden flex-col items-center justify-center z-50">
            <div class="w-8 h-8 border-2 border-gray-200 border-t-dark rounded-full animate-spin"></div>
            <p class="mt-4 text-dark text-sm font-medium tracking-wide">Authenticating Tech...</p>
        </div>
    </div>

    <!-- Script Connection -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
